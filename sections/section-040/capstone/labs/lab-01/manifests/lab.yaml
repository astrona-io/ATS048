---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: starfleet
data:
  prometheus.yaml: |
    global:
      evaluation_interval: 2s
      scrape_interval: 2s
    rule_files:
    - /rules/*.yaml
    scrape_configs:
    - job_name: probe
      static_configs:
      - labels:
          team: starfleet
        targets:
        - probe:8080
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: crowded
      static_configs:
      - targets:
        - crowded:8080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: starfleet
data:
  rules.yaml: |
    groups: []

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowded-code
  namespace: starfleet
data:
  app.py: |
    MODE = 'orders'
    import http.server

    def build():
        if MODE == 'tickets':
            lines = ['# HELP lab_ticket_info Open support tickets', '# TYPE lab_ticket_info gauge']
            for index in range(200):
                lines.append('lab_ticket_info{ticket_id="t%04d"} 1' % index)
        else:
            lines = ['# HELP lab_http_requests_total Requests by path and request id', '# TYPE lab_http_requests_total counter']
            for path in ('/orders', '/cart', '/search'):
                for index in range(100):
                    lines.append('lab_http_requests_total{path="%s",request_id="r%04d"} %d' % (path, index, index + 1))
        return ('\n'.join(lines) + '\n').encode()

    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass

        def do_GET(self):
            if self.path != '/metrics':
                self.send_response(404)
                self.end_headers()
                return
            body = build()
            self.send_response(200)
            self.send_header('Content-Type', 'text/plain; version=0.0.4; charset=utf-8')
            self.end_headers()
            self.wfile.write(body)

    http.server.ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowded
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowded
  template:
    metadata:
      labels:
        app: crowded
    spec:
      containers:
      - name: crowded
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - -u
        - /code/app.py
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /code
      volumes:
      - name: code
        configMap:
          name: crowded-code
---
apiVersion: v1
kind: Service
metadata:
  name: crowded
  namespace: starfleet
spec:
  selector:
    app: crowded
  ports:
  - port: 8080
    targetPort: 8080
