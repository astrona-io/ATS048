# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Choose The Right Query For Each Metric Type (LAB). Graded against the live Prometheus API.
apiVersion: astrona.io/v1
metadata:
  name: ats-048-lab-040-01-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/prometheus/prometheus:v3.5.5
      - docker.io/library/python:3.13-alpine

bootstrap:
  manifests:
    - name: base
      type: file
      source: manifests/base.yaml
    - name: lab
      type: file
      source: manifests/lab.yaml
  waitFor:
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/prometheus
      namespace: starfleet
    - resource: deploy/traffic
      namespace: starfleet
    - resource: pod/shuttle
      namespace: starfleet

testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: counter-rate-by-status
      description: status:lab_requests:rate1m has one series per status value and no other labels
      type: file
      source: validation/validate-counter-rate-by-status.sh
      hint: A counter needs rate(). Aggregate with sum by (status).
    - name: histogram-quantile
      description: lab:request_duration_seconds:p95 is a latency in seconds from the histogram buckets
      type: file
      source: validation/validate-histogram-quantile.sh
      hint: Use histogram_quantile over the rate of the _bucket series, summed by le.
    - name: gauge-max
      description: lab:queue_depth:max is the highest current queue depth
      type: file
      source: validation/validate-gauge-max.sh
      hint: A gauge is already a current value. Do not apply rate() to it.
    - name: rules-healthy
      description: All three rules are loaded from the rules file and healthy
      type: file
      source: validation/validate-rules-healthy.sh
      hint: Put all three records in one group of rules.yaml and restart Prometheus.

teardown:
  keepCluster: false
