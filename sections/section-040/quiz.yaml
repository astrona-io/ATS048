# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats048-040
course_id: ATS048
exam_code: PCA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Data Model and Labels"
questions:
  - id: ats048-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what identifies a time series in Prometheus"
    source_readings:
      - sections/section-040/module-01/course-01-series-samples-names-and-labels.md
    prompt: |-
      Two series have the metric name `lab_requests_total` and the same `job` and `instance`. One has `status="200"` and the other has `status="500"`. How does Prometheus treat them?
    options:
      - id: a
        text: "As one series with two values, because the metric name is the same."
        explanation: "The name alone does not identify a series. The full label set does."
      - id: b
        text: "As two separate series, because one label value differs."
        explanation: "Correct. A series is identified by the metric name and the full set of labels, so one different value makes a new series."
      - id: c
        text: "As one series, because `status` is only a description of the sample."
        explanation: "Labels are part of the identity, not a description."
      - id: d
        text: "As an error, because a metric name can only exist once."
        explanation: "A metric name exists once for each label set, and many label sets are normal."
    correct_option: b
    explanation: "A series is identified by the metric name and the full set of labels, so one different label value makes a new series."

  - id: ats048-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the label that holds the metric name and the prefix reserved for Prometheus"
    source_readings:
      - sections/section-040/module-01/course-01-series-samples-names-and-labels.md
    prompt: |-
      A selector `http_requests_total` is a short form of which selector, and which label names may an application not define?
    options:
      - id: a
        text: "`{__name__=\"http_requests_total\"}`, and labels starting with two underscores."
        explanation: "Correct. The metric name is the label `__name__`, and names that start with `__` are reserved for Prometheus."
      - id: b
        text: "`{name=\"http_requests_total\"}`, and labels starting with one underscore."
        explanation: "The label is `__name__`, and the reserved prefix is two underscores."
      - id: c
        text: "`{__type__=\"http_requests_total\"}`, and labels ending with `_total`."
        explanation: "`__type__` is not the name label, and `_total` is a naming convention, not a reserved suffix."
      - id: d
        text: "`{job=\"http_requests_total\"}`, and labels starting with `exported_`."
        explanation: "`job` holds the job name, not the metric name."
    correct_option: a
    explanation: "The metric name is stored in the label `__name__`, and label names that start with two underscores are reserved for Prometheus."

  - id: ats048-040-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Apply the metric naming conventions for units and counters"
    source_readings:
      - sections/section-040/module-01/course-01-series-samples-names-and-labels.md
    prompt: |-
      An application measures how long requests take and counts them. Which pair of metric names follows the Prometheus conventions?
    options:
      - id: a
        text: "`request_duration_milliseconds` and `requests_count`"
        explanation: "Base units are seconds, and a counter ends in `_total`."
      - id: b
        text: "`RequestDurationSeconds` and `requests_by_status_total`"
        explanation: "Names use lowercase with underscores, and the name must not contain a label name such as `status`."
      - id: c
        text: "`request_duration_seconds` and `requests_total`"
        explanation: "Correct. Use base units as a plural suffix and end counters with `_total`."
      - id: d
        text: "`request:duration:seconds` and `requests:total`"
        explanation: "The colon is reserved for recording rule names."
    correct_option: c
    explanation: "Metrics use base units as a suffix, such as `_seconds`, and counters end in `_total`. The colon belongs to recording rules."

  - id: ats048-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the correct function for a counter"
    source_readings:
      - sections/section-040/module-01/course-02-counters-and-gauges.md
    prompt: |-
      You want the number of requests per second for each `status` from the counter `lab_requests_total`. Which expression is correct?
    options:
      - id: a
        text: "`sum by (status) (lab_requests_total)`"
        explanation: "The raw counter is the total since the last restart, not a speed."
      - id: b
        text: "`rate(sum by (status) (lab_requests_total)[1m])`"
        explanation: "This is not valid PromQL. A range selector cannot follow an aggregation like this, and summing before rate hides resets."
      - id: c
        text: "`sum by (status) (rate(lab_requests_total[1m]))`"
        explanation: "Correct. Take the rate of each series first and then aggregate."
      - id: d
        text: "`rate(lab_requests_total[1m]) by (status)`"
        explanation: "This is not valid syntax. The clause belongs to the aggregation operator."
    correct_option: c
    explanation: "Take `rate` of each counter series first, then aggregate with `sum by (status)`."

  - id: ats048-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why rate is wrong for a gauge"
    source_readings:
      - sections/section-040/module-01/course-02-counters-and-gauges.md
    prompt: |-
      A gauge `queue_depth` falls from 5 to 3. What does `rate(queue_depth[1m])` do with that decrease?
    options:
      - id: a
        text: "It treats the decrease as a counter reset and returns a number without meaning."
        explanation: "Correct. `rate` assumes only counters, so a decrease is read as a reset."
      - id: b
        text: "It returns a negative per-second change."
        explanation: "`rate` is built for counters and does not return negative values for a decrease."
      - id: c
        text: "It returns an error, because the metric is a gauge."
        explanation: "Prometheus does not stop you from using the wrong function. The type is only metadata."
      - id: d
        text: "It returns the average of the gauge."
        explanation: "The function for an average over time is `avg_over_time`."
    correct_option: a
    explanation: "`rate` treats every decrease as a counter reset, so on a gauge it returns a value without meaning. The type is metadata, so Prometheus does not raise an error."

  - id: ats048-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Estimate a percentile from a histogram"
    source_readings:
      - sections/section-040/module-01/course-03-histograms-and-summaries.md
    prompt: |-
      Which expression estimates the 95th percentile of request duration over the last five minutes from `request_duration_seconds_bucket` across all instances?
    options:
      - id: a
        text: "`histogram_quantile(0.95, request_duration_seconds_bucket)`"
        explanation: "Raw buckets are counters for the whole run time, and the result would describe all time."
      - id: b
        text: "`histogram_quantile(95, sum by (le) (rate(request_duration_seconds_bucket[5m])))`"
        explanation: "The quantile is a value between 0 and 1, not 95."
      - id: c
        text: "`histogram_quantile(0.95, sum(rate(request_duration_seconds_bucket[5m])))`"
        explanation: "Without `by (le)` the buckets lose the `le` label and the function returns no result."
      - id: d
        text: "`histogram_quantile(0.95, sum by (le) (rate(request_duration_seconds_bucket[5m])))`"
        explanation: "Correct. Take the rate, sum by `le` so the instances merge, and call the function with a quantile between 0 and 1."
    correct_option: d
    explanation: "Take the rate of the buckets, sum by `le` and call `histogram_quantile` with a quantile between 0 and 1."

  - id: ats048-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose between histogram and summary"
    source_readings:
      - sections/section-040/module-01/course-03-histograms-and-summaries.md
    prompt: |-
      A service runs on twenty instances. You need the 99th percentile of latency for the whole service and you may later ask for the 95th. Which type fits?
    options:
      - id: a
        text: "A summary, because it stores ready quantiles."
        explanation: "Summary quantiles cannot be combined across instances."
      - id: b
        text: "A gauge that holds the latest duration."
        explanation: "A gauge holds one value and cannot describe a distribution."
      - id: c
        text: "A counter of requests."
        explanation: "A counter gives a rate of events, not a distribution of durations."
      - id: d
        text: "A histogram, because buckets sum across instances and the quantile is chosen in the query."
        explanation: "Correct. Bucket series can be summed across instances, and the quantile is a query parameter."
    correct_option: d
    explanation: "A histogram stores cumulative bucket counters that can be summed across instances, and the query chooses the quantile."

  - id: ats048-040-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Use label matchers and know that regular expressions are anchored"
    source_readings:
      - sections/section-040/module-02/course-01-label-matchers-and-aggregation.md
    prompt: |-
      The counter `lab_http_requests_total` has the `path` values `/orders`, `/cart` and `/search`. What does `lab_http_requests_total{path=~"/ord"}` select?
    options:
      - id: a
        text: "The series of `/orders` only."
        explanation: "The expression must match the whole value, and `/ord` is not the whole value."
      - id: b
        text: "Nothing, because the regular expression must match the whole label value."
        explanation: "Correct. Regular expression matchers are fully anchored."
      - id: c
        text: "The series of all three paths."
        explanation: "Nothing in the pattern matches `/cart` or `/search`."
      - id: d
        text: "An error, because the pattern is too short."
        explanation: "The selector is valid and returns an empty result."
    correct_option: b
    explanation: "Regular expression matchers are fully anchored at both ends, so `/ord` matches no value. `/ord.*` would match `/orders`."

  - id: ats048-040-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the labels an aggregation keeps"
    source_readings:
      - sections/section-040/module-02/course-01-label-matchers-and-aggregation.md
    prompt: |-
      `up` has the labels `job` and `instance`. What labels does `sum without (instance) (up)` return?
    options:
      - id: a
        text: "No labels, only one series."
        explanation: "That is the result of `sum` without a clause."
      - id: b
        text: "Only `instance`."
        explanation: "`without` drops the listed labels, so `instance` is the one that is removed."
      - id: c
        text: "`job` and every other label except `instance`."
        explanation: "Correct. `without` keeps every label except those listed."
      - id: d
        text: "Only `job`, no matter which other labels exist."
        explanation: "That describes `by (job)`. `without` also keeps labels that appear later."
    correct_option: c
    explanation: "`without (instance)` drops `instance` and keeps all other labels. `by (job)` would keep only `job`."

  - id: ats048-040-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Calculate cardinality from a label design"
    source_readings:
      - sections/section-040/module-02/course-02-cardinality-and-series-churn.md
    prompt: |-
      A counter has the labels `path` (3 values), `status` (4 values) and `request_id` (100 values for every combination of the first two). If every combination occurs, how many series does it have?
    options:
      - id: a
        text: "107, the sum of the label values."
        explanation: "Labels multiply. They do not add."
      - id: b
        text: "12, because `request_id` is only a descriptive label."
        explanation: "Every value of `request_id` creates a new series."
      - id: c
        text: "1200, the product of 3, 4 and 100."
        explanation: "Correct. With independent labels the number of series is the product of the label cardinalities."
      - id: d
        text: "300, because only `path` and `request_id` count."
        explanation: "`status` also multiplies the count."
    correct_option: c
    explanation: "With independent labels the series count is the product of the label cardinalities: 3 times 4 times 100 equals 1200."

  - id: ats048-040-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain what a recording rule does and does not save"
    source_readings:
      - sections/section-040/module-02/course-02-cardinality-and-series-churn.md
    prompt: |-
      A dashboard is slow because `sum by (path) (lab_http_requests_total)` reads 300 series on every refresh. You add a recording rule with that expression. What changes?
    options:
      - id: a
        text: "The dashboard reads 3 stored series, and the 300 raw series still use memory."
        explanation: "Correct. The rule moves the aggregation work to the evaluation interval, but it does not delete its input."
      - id: b
        text: "The 300 raw series are deleted because the rule replaces them."
        explanation: "A rule never deletes its input."
      - id: c
        text: "Memory use drops to 3 series."
        explanation: "Prometheus still keeps every scraped series in the head block."
      - id: d
        text: "Nothing changes, because dashboards cannot read recorded series."
        explanation: "A recorded series is a normal series that a dashboard can query."
    correct_option: a
    explanation: "A recording rule stores the aggregated result, so queries read fewer series, but the raw series stay in memory."

  - id: ats048-040-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain series churn"
    source_readings:
      - sections/section-040/module-02/course-02-cardinality-and-series-churn.md
    prompt: |-
      A team adds the label `version` with the application version to every metric. After ten deployments memory use and the time of long queries have grown. What is the cause?
    options:
      - id: a
        text: "Counters reset at every deployment, and Prometheus stores the reset values twice."
        explanation: "Counter resets do not create series."
      - id: b
        text: "Every new version value starts new series and leaves the old series behind, which is series churn."
        explanation: "Correct. A label that changes at each deployment restarts every series that carries it."
      - id: c
        text: "`version` is a reserved label that Prometheus stores slowly."
        explanation: "`version` is not reserved. Only names that start with two underscores are."
      - id: d
        text: "Labels with letters and numbers need more memory than labels with numbers only."
        explanation: "Memory depends on the number of series, not on the characters in the value."
    correct_option: b
    explanation: "A label whose value changes with each deployment starts new series each time. This is series churn, and the old series stay in the stored blocks."

  - id: ats048-040-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain staleness markers"
    source_readings:
      - sections/section-040/module-02/course-03-staleness-up-and-target-labels.md
    prompt: |-
      A target stops and its scrape fails. Its last samples are five seconds old. What does `count(some_metric{job="app"})` return a moment later?
    options:
      - id: a
        text: "The old count, because the lookback delta is five minutes."
        explanation: "Staleness markers end the series before the lookback delta runs out."
      - id: b
        text: "0, because the series have the value zero."
        explanation: "A stale series has no value, and PromQL returns an empty result and not zero."
      - id: c
        text: "An empty result, because Prometheus wrote staleness markers for the series."
        explanation: "Correct. A failed scrape makes all series of the target stale."
      - id: d
        text: "An error from the query API."
        explanation: "The query is valid and the result is empty."
    correct_option: c
    explanation: "When a scrape fails, Prometheus writes staleness markers for all series of the target, so queries return no value."

  - id: ats048-040-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Use up, instance and job"
    source_readings:
      - sections/section-040/module-02/course-03-staleness-up-and-target-labels.md
    prompt: |-
      Which expression returns the targets whose last scrape failed?
    options:
      - id: a
        text: "`up == 0`"
        explanation: "Correct. Prometheus writes `up` as 1 for a successful scrape and 0 for a failed one."
      - id: b
        text: "`absent(up)`"
        explanation: "`absent` returns 1 when the whole selector has no series, which is not the case for a failed target."
      - id: c
        text: "`scrape_duration_seconds == 0`"
        explanation: "A zero duration does not mean that a scrape failed."
      - id: d
        text: "`instance == \"down\"`"
        explanation: "`instance` holds the address of the target and not its health."
    correct_option: a
    explanation: "`up` is a synthetic series that is 1 for a successful scrape and 0 for a failed one, so `up == 0` finds the failed targets."

