---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: starfleet
data:
  prometheus.yaml: |
    global:
      evaluation_interval: 2s
      scrape_interval: 2s
    rule_files:
    - /rules/*.yaml
    scrape_configs:
    - job_name: probe
      metrics_path: /metrics
      static_configs:
      - labels:
          team: starfleet
        targets:
        - probe:8080
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: exporter
      static_configs:
      - labels:
          env: training
        targets:
        - exporter:8080
      metric_relabel_configs:
      - source_labels: [__name__]
        regex: lab_queue_length
        action: drop
